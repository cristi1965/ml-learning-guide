是二分查找", "group": "起步", "goal": "识别两种方法依赖的信息。", "example": "猜单价在0到10之间，二分先猜5再缩区间。梯度下降则从当前单价出发，用损失的局部变化趋势调整。", "mechanism": "二分需要可排除半边的条件，例如有序或单调关系。神经网络有多个参数和复杂损失曲面；梯度下降不保证找到全局最优。苹果单价甚至可直接用6÷2求出，教学例子并不需要复杂算法。", "question": "二分查找的关键动作是？", "options": ["按梯度更新所有参数", "根据判断排除一半候选区间", "随机更改答案"], "answer": 1, "feedback": "区间折半才是二分的核心；“逐步靠近答案”并不是它独有的特征。", "source": "algorithms/deeplearning/gradient_descent.py", "demo": "", "id": 2, "code": {"start": 6, "end": 30, "lines": [{"text": "def gradient_descent(X, y, weights, learning_rate, n_iterations, batch_size=1, method='batch'):", "line": 6}, {"text": "    # 中文讲解：外层控制完整迭代轮数。", "line": null}, {"text": "    for i in range(n_iterations):", "line": 7}, {"text": "        # 中文讲解：使用所有样本计算这次更新。", "line": null}, {"text": "        if method == 'batch':", "line": 8}, {"text": "            # 中文讲解：批量计算预测误差。", "line": null}, {"text": "            errors = X @ weights - y", "line": 9}, {"text": "            # derivative of error = 2 * error * derivative of error with respect to weights = 2 * error * X = 1/2n * 2 * error * X = errors * X / n", "line": 10}, {"text": "            # 中文讲解：完整均方误差的梯度含系数2。", "line": null}, {"text": "            gradients = 2 * X.T @ errors / len(y) ", "line": 11}, {"text": "            # 中文讲解：用学习率乘梯度，再从旧参数中减去。", "line": null}, {"text": "            weights = weights - learning_rate * gradients ", "line": 12}, {"text": "        # 中文讲解：一次只用一条样本更新，噪声通常更大。", "line": null}, {"text": "        elif method == 'stochastic':", "line": 13}, {"text": "            for i in range(len(y)):", "line": 14}, {"text": "                # 中文讲解：保留二维形状取出一条样本。", "line": null}, {"text": "                xi= X[i:i+1]", "line": 15}, {"text": "                # 中文讲解：取出同位置的目标值。", "line": null}, {"text": "                yi= y[i:i+1]", "line": 16}, {"text": "                error = xi @ weights - yi", "line": 17}, {"text": "                gradients = 2 * xi.T @ error", "line": 18}, {"text": "                # 中文讲解：用学习率乘梯度，再从旧参数中减去。", "line": null}, {"text": "                weights = weights - learning_rate * gradients", "line": 19}, {"text": "        # 中文讲解：每次使用一批样本，在效率与梯度噪声之间折中。", "line": null}, {"text": "        elif method == 'mini_batch':", "line": 20}, {"text": "            # Shuffle data", "line": 21}, {"text": "            for i in range(0, len(y), batch_size):", "line": 22}, {"text": "                # 中文讲解：切出本批输入，不改变原数据顺序。", "line": null}, {"text": "                xi = X[i:i+batch_size]", "line": 23}, {"text": "                # 中文讲解：切出同一批真实标签。", "line": null}, {"text": "                yi = y[i:i+batch_size]", "line": 24}, {"text": "                errors = xi @ weights - yi", "line": 25}, {"text": "                gradients = 2 * xi.T @ errors / len(yi)", "line": 26}, {"text": "                # 中文讲解：用学习率乘梯度，再从旧参数中减去。", "line": null}, {"text": "                weights = weights - learning_rate * gradients", "line": 27}, {"text": "        else:", "line": 28}, {"text": "            raise ValueError(\"Method must be 'batch', 'stochastic', or 'mini_batch'\")", "line": 29}, {"text": "    return weights", "line": 30}], "notes": ["method决定一次更新使用全部、一条还是一小批数据。", "这里gradients有系数2，对应完整均方误差。", "原注释写Shuffle data，但实现只按顺序切片，没有随机打乱。"], "symbol": "gradient_descent"}}, {"title": "向量和矩阵：批量计算", "group": "基础", "goal": "读懂 X @ theta。", "example": "一笔订单的特征可以是[苹果斤数,梨斤数]。两种单价是[3,4]；[2,1]这笔订单价格为2×3+1×4=10。", "mechanism": "向量是一列或一行数。矩阵可把多笔订单叠起来。矩阵乘法中，左边一行与右边一列逐项相乘再求和；内侧维度必须相等。", "question": "[2,1]与单价[3,4]的总价是？", "options": ["9", "14", "10"], "answer": 2, "feedback": "对应位置相乘再相加：2×3+1×4=10。", "source": "algorithms/math/matrixmul.py", "demo": "matrix", "id": 3, "code": {"start": 4, "end": 17, "lines": [{"text": "def matrixmul(", "line": 4}, {"text": "    a: list[list[int | float]], b: list[list[int | float]]", "line": 5}, {"text": ") -> list[list[int | float]]:", "line": 6}, {"text": "    # 中文讲解：读取左矩阵的行数和列数。", "line": null}, {"text": "    m, n1 = len(a), len(a[0])", "line": 7}, {"text": "    # 中文讲解：读取右矩阵的行数和列数。", "line": null}, {"text": "    n2, p = len(b), len(b[0])", "line": 8}, {"text": "    # 中文讲解：内侧维度不相等时无法相乘。", "line": null}, {"text": "    if n1 != n2:", "line": 9}, {"text": "        return -1", "line": 10}, {"text": "    # else do matrix mul", "line": 11}, {"text": "    # 中文讲解：先创建m行p列的全零输出。", "line": null}, {"text": "    c = [[0 for _ in range(p)] for _ in range(m)]", "line": 12}, {"text": "    # 中文讲解：选择左矩阵第i行。", "line": null}, {"text": "    for i in range(m):", "line": 13}, {"text": "        # 中文讲解：选择右矩阵第j列。", "line": null}, {"text": "        for j in range(p):", "line": 14}, {"text": "            # 中文讲解：沿共同维度逐个配对。", "line": null}, {"text": "            for k in range(n1):", "line": 15}, {"text": "                # 中文讲解：对应元素相乘并累加到这个输出格。", "line": null}, {"text": "                c[i][j] += a[i][k] * b[k][j]", "line": 16}, {"text": "    return c", "line": 17}], "notes": ["a形状为m×n1，b形状为n2×p；n1必须等于n2。", "外两层循环选择输出位置，内层k做这一行和这一列的点积。", "此实现假设输入非空且各行长度一致，不兼容时返回−1。"], "symbol": "matrixmul"}}, {"title": "线性回归与偏置", "group": "基础", "goal": "理解 y=wx+b。", "example": "送货费固定2元，苹果每斤3元。买2斤总价8元；买0斤时模型仍输出配送费2元。", "mechanism": "w控制每增加一斤涨多少钱，b控制固定起点。源码用一列全1表示偏置。正规方程需要可逆条件；梯度法用重复更新求解。", "question": "固定配送费对应哪个量？", "options": ["输入x", "偏置b", "损失L"], "answer": 1, "feedback": "偏置是不随斤数变化的固定项，不是斜率。", "source": "algorithms/machinelearning/linear_regression.py", "demo": "", "id": 4, "code": {"start": 29, "end": 34, "lines": [{"text": "def linear_regression_normal_equation(", "line": 29}, {"text": "    X: list[list[float]], y: list[float]", "line": 30}, {"text": ") -> list[float]:", "line": 31}, {"text": "    # 中文讲解：转置使行列互换，为正规方程准备Xᵀ。", "line": null}, {"text": "    x_tranpose = np.transpose(X)", "line": 32}, {"text": "    # 中文讲解：计算(XᵀX)⁻¹Xᵀy；求逆要求矩阵可逆。", "line": null}, {"text": "    theta = np.linalg.inv(x_tranpose @ X) @ x_tranpose @ y", "line": 33}, {"text": "    # 中文讲解：保留4位小数并转为Python列表。", "line": null}, {"text": "    return np.round(theta, 4).tolist()", "line": 34}], "notes": ["这是正规方程，一次计算参数，不使用梯度下降。", "若需要偏置，要给X添加全1列。", "XᵀX可能不可逆；本实现没有用伪逆或正则化兜底。"], "symbol": "linear_regression_normal_equation"}}, {"title": "分类、概率与评价", "group": "传统ML", "goal": "区分预测类别和预测金额。", "example": "回归预测价格；分类判断邮件是否垃圾邮件。逻辑回归把分数经sigmoid转成0到1之间的值，再按阈值分类。", "mechanism": "准确率是预测正确的比例。100封邮件只有1封垃圾邮件，全部猜正常也有99%准确率，却一封垃圾邮件也抓不到；需结合precision与recall。", "question": "全部猜正常得到99%准确率，说明什么？", "options": ["已经能识别垃圾邮件", "必须结合类别分布与召回率评价", "准确率一定算错"], "answer": 1, "feedback": "类别不平衡会掩盖漏检；召回率关注实际正例中找回多少。", "source": "algorithms/machinelearning/logistic_regression.py", "demo": "", "id": 5, "code": {"start": 21, "end": 25, "lines": [{"text": "def predict(X, weights, bias):", "line": 21}, {"text": "    # 中文讲解：先做线性加权求和，加上偏置。", "line": null}, {"text": "    forward_pass = np.dot(X, weights) + bias", "line": 22}, {"text": "    # 中文讲解：应用sigmoid，把分数映射到0～1。", "line": null}, {"text": "    sigmoid = 1 / (1 + np.exp(-forward_pass))", "line": 23}, {"text": "    # 中文讲解：选择分类阈值为0.5。", "line": null}, {"text": "    threshold = .5", "line": 24}, {"text": "    # 中文讲解：比较阈值，再把布尔值转换为0或1。", "line": null}, {"text": "    return np.round(sigmoid >= threshold).astype(int)", "line": 25}], "notes": ["X @ weights + bias先给每个样本打分。", "sigmoid将分数压到0～1，0.5是本例决策阈值。", "函数只返回0/1类别，不是训练函数，也不是返回概率的接口。"], "symbol": "predict"}}, {"title": "KNN、聚类与PCA", "group": "传统ML", "goal": "分清三个不同任务。", "example": "KNN根据附近已标注样本投票；K-Means把相近样本分组；PCA找方差较大的方向压缩表示。", "mechanism": "KNN是监督分类，K-Means不需要类别标签。PCA通常需中心化，特征尺度差异大时考虑标准化。高方差不保证对分类最有用。", "question": "没有标签，想把顾客按相似性分组，优先理解？", "options": ["K-Means", "KNN标签投票", "训练集准确率"], "answer": 0, "feedback": "聚类寻找数据内部分组，不要求先给出正确类别。", "source": "algorithms/machinelearning/k_means.py", "demo": "", "id": 6, "code": {"start": 52, "end": 82, "lines": [{"text": "def k_means_clustering( points: list[tuple[float, float]], k: int, initial_centroids: list[tuple[float, float]], max_iterations: int,) -> list[tuple[float, float]]:", "line": 52}, {"text": "    # 中文讲解：将样本转为浮点数组，避免整型计算截断。", "line": null}, {"text": "    points = np.array(points, dtype=float)", "line": 53}, {"text": "    # 中文讲解：读取给定的初始中心。", "line": null}, {"text": "    centroids = np.array(initial_centroids, dtype=float)", "line": 54}, {"text": "", "line": 55}, {"text": "    for _ in range(max_iterations):", "line": 56}, {"text": "        # 中文讲解：为k个簇建立空的成员列表。", "line": null}, {"text": "        clusters = [[] for _ in range(k)]", "line": 57}, {"text": "        # for each point -> calculate distance of that point to the centroid", "line": 58}, {"text": "        for pt in points:", "line": 59}, {"text": "            # 中文讲解：计算当前点到每个中心的距离。", "line": null}, {"text": "            dists = [euclid_distance(pt, c) for c in centroids]", "line": 60}, {"text": "            # 中文讲解：找到距离最小的中心下标。", "line": null}, {"text": "            best_idx = np.argmin(dists)", "line": 61}, {"text": "            # 中文讲解：把该点加入最近的簇。", "line": null}, {"text": "            clusters[best_idx].append(pt)", "line": 62}, {"text": "", "line": 63}, {"text": "        # update", "line": 64}, {"text": "        new_centroids = []", "line": 65}, {"text": "        for i in range(k):", "line": 66}, {"text": "            # 中文讲解：取出一个簇的成员。", "line": null}, {"text": "            members = clusters[i]", "line": 67}, {"text": "            if members:", "line": 68}, {"text": "                member_arr = np.array(members)", "line": 69}, {"text": "                # 中文讲解：对每一维特征分别求平均作为新中心。", "line": null}, {"text": "                mean = np.mean(member_arr, axis=0)", "line": 70}, {"text": "                new_centroids.append(np.round(mean, 4))", "line": 71}, {"text": "            else:  # if mean = 0", "line": 72}, {"text": "                new_centroids.append(centroids[i])", "line": 73}, {"text": "", "line": 74}, {"text": "        # check for convergence", "line": 75}, {"text": "        # 中文讲解：判断新旧中心是否足够接近，可提前停止。", "line": null}, {"text": "        if np.allclose(centroids, new_centroids, atol=1e-6):", "line": 76}, {"text": "            break", "line": 77}, {"text": "        # 中文讲解：将新中心用于下一轮分配。", "line": null}, {"text": "        centroids = new_centroids", "line": 78}, {"text": "", "line": 79}, {"text": "    # return centroids", "line": 80}, {"text": "    final = [tuple(float(x) for x in c) for c in centroids]", "line": 81}, {"text": "    return final", "line": 82}], "notes": ["每轮先按最近中心分组，再用组内均值重算中心。", "空簇保留旧中心；原else注释说mean=0不准确。", "返回的是簇中心，不是每个样本的类别标签。"], "symbol": "k_means_clustering"}}, {"title": "神经元与非线性", "group": "神经网络", "goal": "理解为什么需要激活函数。", "example": "神经元先算 z=w₁x₁+w₂x₂+b，再应用激活。ReLU把负数变成0，把正数保留。", "mechanism": "如果只堆线性层，不加非线性，多层仍可合并成一个线性变换。非线性使网络能表示更复杂的关系，但并非自动保证学好。", "question": "ReLU(−3)等于？", "options": ["−3", "3", "0"], "answer": 2, "feedback": "ReLU(z)=max(0,z)。在正数区域保留原值，负数区域输出0。", "source": "algorithms/deeplearning/single_neuron.py", "demo": "", "id": 7, "code": {"start": 19, "end": 28, "lines": [{"text": "def single_neuron_model(features: list[list[float]], labels: list[int], weights: list[float], bias: float) -> (list[float], float):", "line": 19}, {"text": "    # 中文讲解：输入转为NumPy数组，每行一个样本。", "line": null}, {"text": "    features_np = np.array(features)", "line": 20}, {"text": "    # 中文讲解：参数转为向量，对应每项特征。", "line": null}, {"text": "    weights_np = np.array(weights)", "line": 21}, {"text": "    # 中文讲解：保存各样本真实标签。", "line": null}, {"text": "    labels_np = np.array(labels)", "line": 22}, {"text": "    # 中文讲解：批量执行特征加权求和再加偏置。", "line": null}, {"text": "    predicted = np.dot(features_np, weights_np) + bias", "line": 23}, {"text": "    # 中文讲解：对每个线性分数应用sigmoid激活。", "line": null}, {"text": "    probabilities = np.array([sigmoid(val) for val in predicted])", "line": 24}, {"text": "    # 中文讲解：计算概率与标签之间的平均平方误差。", "line": null}, {"text": "    mse = np.mean((labels_np - probabilities) ** 2)", "line": 25}, {"text": "    rounded_probabilities = np.round(probabilities, 4)", "line": 26}, {"text": "    rounded_mse = np.round(mse, 4)", "line": 27}, {"text": "    return rounded_probabilities.tolist(), rounded_mse", "line": 28}], "notes": ["本课用ReLU解释非线性，但这个源码实例实际使用sigmoid。", "sigmoid函数在同文件定义，片段依赖它和NumPy。", "这里评估MSE；二分类也常用交叉熵，不要以为只能用MSE。"], "symbol": "single_neuron_model"}}, {"title": "反向传播：谁该负责", "group": "神经网络", "goal": "手算一条链式法则。", "example": "f=(a+b)×c。a=2,b=3,c=4时，先算和5，再算输出20。a增加一点会让f以4倍速度增加。", "mechanism": "局部导数相乘沿路径传递，多条路径贡献相加。这里df/da=4，df/db=4，df/dc=5。反向传播计算梯度，优化器才负责更新参数。", "question": "这个例子里df/dc是多少？", "options": ["4", "5", "20"], "answer": 1, "feedback": "把(a+b)看作固定系数，f对c的变化率就是a+b=5。", "source": "algorithms/deeplearning/autograd.py", "demo": "", "id": 8, "code": {"start": 27, "end": 37, "lines": [{"text": "    def __mul__(self, other):", "line": 27}, {"text": "        # 中文讲解：允许普通数字参与运算，先包装成Value节点。", "line": null}, {"text": "        other = other if isinstance(other, Value) else Value(other)", "line": 28}, {"text": "        # 中文讲解：创建乘法结果节点，同时记录两个上游节点。", "line": null}, {"text": "        out = Value(self.data * other.data, (self, other), \"*\")", "line": 29}, {"text": "", "line": 30}, {"text": "        # 中文讲解：定义这个乘法节点的局部反传规则。", "line": null}, {"text": "        def _backward():", "line": 31}, {"text": "            # 中文讲解：左输入的贡献=右输入值×输出传来的梯度。", "line": null}, {"text": "            self.grad += other.data * out.grad", "line": 32}, {"text": "            # 中文讲解：右输入的贡献=左输入值×输出传来的梯度。", "line": null}, {"text": "            other.grad += self.data * out.grad", "line": 33}, {"text": "", "line": 34}, {"text": "        # 中文讲解：把反传规则挂到结果节点，稍后统一执行。", "line": null}, {"text": "        out._backward = _backward", "line": 35}, {"text": "", "line": 36}, {"text": "        return out", "line": 37}], "notes": ["这是Value类的乘法运算方法，需放回原类上下文理解。", "乘法的局部导数：对左边求导等于右边值，反之亦然。", "+=把多条路径的梯度贡献累加；此处只算梯度，不更新参数。"], "symbol": "Value.__mul__"}}, {"title": "Autograd与训练循环", "group": "神经网络", "goal": "将手算变成计算图。", "example": "Value节点保存数值、梯度和前驱。前向搭图；从最终损失开始反向传播；最后用梯度改权重。", "mechanism": "逆拓扑遍历保证反传顺序。共享节点需要累加贡献。训练下一轮前清空参数梯度，避免无意积累；不清零也可用于有意的梯度累积。", "question": "普通逐批训练为什么清空旧梯度？", "options": ["防止无意叠加上轮梯度", "删除所有模型参数", "让损失永远为0"], "answer": 0, "feedback": "清梯度不等于清权重；上一轮学到的参数仍被保留。", "source": "tests/test_autograd.py", "demo": "", "id": 9, "code": {"start": 52, "end": 62, "lines": [{"text": "def test_chain_rule():", "line": 52}, {"text": "    # f = (a + b) * c", "line": 53}, {"text": "    # 中文讲解：创建可记录梯度的输入a。", "line": null}, {"text": "    a = Value(2.0)", "line": 54}, {"text": "    # 中文讲解：创建第二个输入b。", "line": null}, {"text": "    b = Value(3.0)", "line": 55}, {"text": "    # 中文讲解：创建乘法因子c。", "line": null}, {"text": "    c = Value(4.0)", "line": 56}, {"text": "    # 中文讲解：先相加再相乘，自动连接计算图。", "line": null}, {"text": "    d = (a + b) * c  # d = 20", "line": 57}, {"text": "    # 中文讲解：从结果反向传播，计算各输入的梯度。", "line": null}, {"text": "    d.backward()", "line": 58}, {"text": "    # 中文讲解：检查前向输出是否符合手算。", "line": null}, {"text": "    assert d.data == 20.0", "line": 59}, {"text": "    # 中文讲解：检查a的梯度，也就是乘法因子c。", "line": null}, {"text": "    assert a.grad == 4.0  # dd/da = c = 4", "line": 60}, {"text": "    # 中文讲解：检查b的梯度，它与a走同样的路径。", "line": null}, {"text": "    assert b.grad == 4.0  # dd/db = c = 4", "line": 61}, {"text": "    # 中文讲解：检查c的梯度，应该等于a+b。", "line": null}, {"text": "    assert c.grad == 5.0  # dd/dc = (a+b) = 5", "line": 62}], "notes": ["测试先建图，再执行backward，最后断言数值与梯度。", "断言不通过会让pytest失败；不是简单打印“成功”。", "把c改成6时，输出应30，a/b梯度应6，c梯度仍5；对应断言也需要更新。"], "symbol": "test_chain_rule"}}, {"title": "CNN与ResNet：看图", "group": "模型", "goal": "理解卷积和残差各自做什么。", "example": "卷积核像一个局部模式探测器，在图像不同位置使用同一组权重。残差块输出x+F(x)。", "mechanism": "卷积的参数共享降低参数量；stride影响空间尺寸。残差相加要求形状兼容，改变通道或下采样时可用投影分支。scratch版本仍使用PyTorch层，不是手写卷积反传。", "question": "残差两路形状不同可以直接相加吗？", "options": ["总能", "需要使形状兼容", "删除所有输入"], "answer": 1, "feedback": "通常用下采样或1×1卷积对齐形状，不能任意相加。", "source": "papers/resnet/resnet34_scratch.py", "demo": "", "id": 10, "code": {"start": 79, "end": 87, "lines": [{"text": "    def forward(self, x):", "line": 79}, {"text": "        # 中文讲解：保存原始输入，供旁路连接使用。", "line": null}, {"text": "        residual = x # input", "line": 80}, {"text": "        # 中文讲解：主路第一组卷积处理。", "line": null}, {"text": "        out = self.conv1(x)", "line": 81}, {"text": "        # 中文讲解：主路第二组卷积处理。", "line": null}, {"text": "        out = self.conv2(out)", "line": 82}, {"text": "        # 中文讲解：若形状需要调整，走投影分支。", "line": null}, {"text": "        if self.downsample:", "line": 83}, {"text": "            # 中文讲解：将旁路输入变换到与主路相同的形状。", "line": null}, {"text": "            residual = self.downsample(x)", "line": 84}, {"text": "        # 中文讲解：将主路学习的变化与旁路输入相加。", "line": null}, {"text": "        out = out + residual", "line": 85}, {"text": "        # 中文讲解：对相加结果应用ReLU。", "line": null}, {"text": "        out = self.relu(out)", "line": 86}, {"text": "        return out", "line": 87}], "notes": ["这是ResidualBlock类中的forward，卷积层在__init__里定义。", "主路计算F(x)，旁路保留x；必要时downsample对齐形状。", "这是仓库自身实现，不能仅凭名称认为所有细节都与原论文完全一致。"], "symbol": "ResidualBlock.forward"}}, {"title": "RNN与LSTM：读序列", "group": "模型", "goal": "理解隐藏状态和门。", "example": "读“今天下雨，所以带伞”时，后面的判断依赖前面信息。RNN每步用当前输入与上一步隐藏状态更新记忆。", "mechanism": "LSTM增加细胞状态及门控，控制保留、写入和输出；缓解长程依赖训练困难，但不保证永久记忆。时间步共享参数。", "question": "RNN相邻时间步通常共享什么？", "options": ["同一组模型参数", "完全相同的输入", "全部预测答案"], "answer": 0, "feedback": "共享参数处理不同时间位置，状态则随输入而改变。", "source": "algorithms/deeplearning/lstm.py", "demo": "", "id": 11, "code": {"start": 24, "end": 58, "lines": [{"text": "    def forward(self, x, h_prev, c_prev):", "line": 24}, {"text": "        \"\"\"", "line": 25}, {"text": "        x: input sequence of shape (T, input_size)", "line": 26}, {"text": "        h_prev: initial hidden state (hidden_size, 1)", "line": 27}, {"text": "        c_prev: initial cell state (hidden_size, 1)", "line": 28}, {"text": "", "line": 29}, {"text": "        Returns:", "line": 30}, {"text": "        - hidden_states: list of hidden states for each timestep", "line": 31}, {"text": "        - h_prev: final hidden state", "line": 32}, {"text": "        - c_prev: final cell state", "line": 33}, {"text": "        \"\"\"", "line": 34}, {"text": "        # 中文讲解：读取时间步数量。", "line": null}, {"text": "        T = x.shape[0]", "line": 35}, {"text": "        # 中文讲解：准备记录每个时间步的隐藏状态。", "line": null}, {"text": "        hidden_states = []", "line": 36}, {"text": "", "line": 37}, {"text": "        # 中文讲解：按顺序逐步读取序列。", "line": null}, {"text": "        for t in range(T):", "line": 38}, {"text": "            # 中文讲解：取当前步输入并转成列向量。", "line": null}, {"text": "            x_t = x[t].reshape(-1, 1)", "line": 39}, {"text": "", "line": 40}, {"text": "            # Concatenate hidden state and input", "line": 41}, {"text": "            # 中文讲解：拼接上一隐藏状态和当前输入。", "line": null}, {"text": "            concat = np.vstack((h_prev, x_t))", "line": 42}, {"text": "", "line": 43}, {"text": "            # Gates", "line": 44}, {"text": "            # 中文讲解：遗忘门：控制旧细胞状态保留多少。", "line": null}, {"text": "            f_t = self.sigmoid(self.Wf @ concat + self.bf)      # forget gate", "line": 45}, {"text": "            # 中文讲解：输入门：控制新候选信息写入多少。", "line": null}, {"text": "            i_t = self.sigmoid(self.Wi @ concat + self.bi)      # input gate", "line": 46}, {"text": "            # 中文讲解：计算当前候选记忆，tanh范围为−1到1。", "line": null}, {"text": "            c_hat = np.tanh(self.Wc @ concat + self.bc)         # candidate cell", "line": 47}, {"text": "            # 中文讲解：输出门：控制当前记忆对外暴露多少。", "line": null}, {"text": "            o_t = self.sigmoid(self.Wo @ concat + self.bo)      # output gate", "line": 48}, {"text": "", "line": 49}, {"text": "            # Cell state update", "line": 50}, {"text": "            # 中文讲解：新记忆=保留的旧记忆+写入的新候选。", "line": null}, {"text": "            c_prev = f_t * c_prev + i_t * c_hat", "line": 51}, {"text": "", "line": 52}, {"text": "            # Hidden state update", "line": 53}, {"text": "            # 中文讲解：将记忆压缩后经输出门得到隐藏状态。", "line": null}, {"text": "            h_prev = o_t * np.tanh(c_prev)", "line": 54}, {"text": "", "line": 55}, {"text": "            # 中文讲解：记录当前隐藏状态供后续使用。", "line": null}, {"text": "            hidden_states.append(h_prev)", "line": 56}, {"text": "", "line": 57}, {"text": "        return hidden_states, h_prev, c_prev", "line": 58}], "notes": ["x包含T个时间步；h_prev是隐藏状态，c_prev是细胞状态。", "sigmoid门值在0到1之间，用逐元素乘法控制信息通过量。", "这里只展示前向传播；权重初始化和sigmoid方法在类中其他位置。"], "symbol": "LSTM.forward"}}, {"title": "Attention：该关注谁", "group": "Transformer", "goal": "理解加权汇总与因果遮罩。", "example": "假设读两个位置：它们的Value（要汇总的内容）分别是10和20。当前Query与这两个Key比较后，得到分数0和ln(3)；softmax把它们变成权重0.25和0.75。最后输出0.25×10+0.75×20=17.5。", "mechanism": "Query表示当前位置用什么方式匹配，Key表示各位置供匹配的特征，Value是匹配后要汇总的内容；三者通常由输入向量乘不同的可学习矩阵产生。softmax先对分数取指数再除以总和，本例是1/(1+3)与3/(1+3)。实际常用向量与缩放点积QKᵀ/√d。因果遮罩先屏蔽未来分数再归一化。下面只操作遮罩，不模拟训练后的语义关系。", "question": "预测下一个字符时，因果遮罩应该屏蔽？", "options": ["所有历史位置", "未来位置", "当前位置和历史位置"], "answer": 1, "feedback": "训练时目标字符可能已在完整序列中，遮罩防止模型提前读取。", "source": "algorithms/attention/masked_attention.py", "demo": "attention", "id": 12, "code": {"start": 11, "end": 17, "lines": [{"text": "def masked_attention(Q: np.ndarray, K: np.ndarray, V: np.ndarray, mask: np.ndarray) -> np.ndarray:", "line": 11}, {"text": "    # 中文讲解：取Query特征维度，用于缩放分数。", "line": null}, {"text": "    dk = Q.shape[-1]", "line": 12}, {"text": "    # 中文讲解：每个Query与各Key做点积，再除以维度平方根。", "line": null}, {"text": "    scores = (Q @ K.T) / np.sqrt(dk)", "line": 13}, {"text": "    # 中文讲解：加遮罩，让未来位置的分数变成极大负数。", "line": null}, {"text": "    masked_score = scores + mask", "line": 14}, {"text": "    # 中文讲解：按每一行softmax，可见位置权重和为1。", "line": null}, {"text": "    masked_weights = softmax(masked_score, axis=-1)", "line": 15}, {"text": "    # 中文讲解：用注意力权重汇总各位置的Value。", "line": null}, {"text": "    output = masked_weights @ V", "line": 16}, {"text": "    return output", "line": 17}], "notes": ["Q、K、V为二维位置×特征矩阵；mask与位置分数矩阵形状兼容。", "mask可见处为0、未来处为极大负数，使softmax后未来权重接近0。", "返回Value的加权汇总，不是注意力权重本身；softmax由同文件函数提供。"], "symbol": "masked_attention"}}, {"title": "Transformer：装配组件", "group": "Transformer", "goal": "分清完整Transformer与GPT。", "example": "位置表示补充顺序，注意力交换位置信息，FFN处理每个位置，残差和归一化协助深层训练。", "mechanism": "仓库transformer.py包含encoder与decoder，decoder还有cross-attention读取encoder输出。MicroGPT使用因果自注意力，没有这个encoder分支。前向运行不代表模型经过训练。", "question": "随机初始化Transformer能前向输出，意味着？", "options": ["已经学会翻译", "形状和计算可能贯通，质量仍需训练评估", "不再需要训练数据"], "answer": 1, "feedback": "“能输出概率”和“概率有用”是两件事。", "source": "algorithms/attention/transformer.py", "demo": "", "id": 13, "code": {"start": 47, "end": 53, "lines": [{"text": "def transformer_forward(src_tokens: np.ndarray, tgt_tokens: np.ndarray, params: dict,", "line": 47}, {"text": "                         n_heads: int, d_model: int) -> np.ndarray:", "line": 48}, {"text": "    # 中文讲解：编码源序列，产生可供解码器参考的表示。", "line": null}, {"text": "    enc_output = encode(src_tokens, params, n_heads, d_model)", "line": 49}, {"text": "    # 中文讲解：用目标前缀与编码结果计算解码表示。", "line": null}, {"text": "    dec_output = decode(tgt_tokens, enc_output, params, n_heads, d_model)", "line": 50}, {"text": "    # 中文讲解：投影到词表大小，得到每个候选token的分数。", "line": null}, {"text": "    logits = output_projection(dec_output, params[\"embedding\"])", "line": 51}, {"text": "    # 中文讲解：按词表维度归一化成概率。", "line": null}, {"text": "    probs = softmax(logits)", "line": 52}, {"text": "    return probs", "line": 53}], "notes": ["这是完整encoder-decoder Transformer的前向入口。", "decode使用编码器输出，内部包含cross-attention。", "只有前向，没有在这个函数里计算损失、反传或更新权重。"], "symbol": "transformer_forward"}}, {"title": "MicroGPT：从字符到名字", "group": "综合", "goal": "串起一次训练与生成。", "example": "名字如ana拆成字符ID，输入[BOS,a,n,a]预测[a,n,a,BOS]。生成时只给开头，再逐个采样字符。", "mechanism": "当前源码是1层、4头、16维embedding、上下文16，纯Python标量自动微分；训练20步，SGD更新。README的Adam描述与实现不一致。脚本顶层下载数据并训练，不建议当普通库导入。", "question": "生成下一个字符时模型依赖什么？", "options": ["完整未来答案", "当前已有上下文", "测试标签自动提示"], "answer": 1, "feedback": "每次用已有上下文预测概率，再采样并追加。它不是检索一个完整名字。", "source": "models/microgpt.py", "demo": "", "id": 14, "code": {"start": 251, "end": 271, "lines": [{"text": "def gpt(tokens):", "line": 251}, {"text": "    \"\"\"Full forward pass for a list of token IDs.", "line": 252}, {"text": "", "line": 253}, {"text": "    Returns a list of logit vectors (one per input position).", "line": 254}, {"text": "    The logits at position t predict the next token given tokens[0..t].", "line": 255}, {"text": "    \"\"\"", "line": 256}, {"text": "    # Build input embeddings: sum token embedding + position embedding for each position", "line": 257}, {"text": "    # 中文讲解：查字符向量和位置向量，并逐维相加。", "line": null}, {"text": "    x_seq = [[te + pe for te, pe in zip(wte[tok], wpe[pos])] for pos, tok in enumerate(tokens)]", "line": 258}, {"text": "", "line": 259}, {"text": "    # 中文讲解：依次通过各个Transformer层。", "line": null}, {"text": "    for i in range(n_layer):", "line": 260}, {"text": "        # Pre-norm: normalise before attention (more stable than post-norm)", "line": 261}, {"text": "        # 中文讲解：每个位置先做RMS归一化。", "line": null}, {"text": "        normed = [rmsnorm(x) for x in x_seq]", "line": 262}, {"text": "        # 中文讲解：因果多头注意力在允许的历史位置间汇总信息。", "line": null}, {"text": "        attn_out = attention_block(normed, wq[i], wk[i], wv[i], wo[i])", "line": 263}, {"text": "        # Residual connection: add attention output back to the input", "line": 264}, {"text": "        # 中文讲解：把注意力结果与原表示残差相加。", "line": null}, {"text": "        x_seq = [[a + b for a, b in zip(attn, x)] for attn, x in zip(attn_out, x_seq)]", "line": 265}, {"text": "", "line": 266}, {"text": "        # Pre-norm + MLP + residual connection", "line": 267}, {"text": "        # 中文讲解：归一化后通过MLP，再与原表示残差相加。", "line": null}, {"text": "        x_seq = [[a + b for a, b in zip(mlp_block(rmsnorm(x), w_fc1[i], w_fc2[i]), x)] for x in x_seq]", "line": 268}, {"text": "", "line": 269}, {"text": "    # Project each position's final embedding to vocabulary logits", "line": 270}, {"text": "    # 中文讲解：把每个位置向量投影为词表logits，供下一字符预测。", "line": null}, {"text": "    return [linear(x, lm_head) for x in x_seq]", "line": 271}], "notes": ["token是字符编号；查表得到向量，再加上可学习位置向量。", "每层先注意力再MLP，各有归一化和残差。", "输出logits是未归一化分数，下一步还要softmax；这里不是整个训练脚本。"], "symbol": "gpt"}}, {"title": "如何验证自己真的学会", "group": "实践", "goal": "用可检查结果代替阅读完成感。", "example": "在克隆仓库根目录完成依赖安装后，执行 uv run pytest tests/test_autograd.py。再创建一个独立练习文件，写下 from algorithms.deeplearning.autograd import Value 导入类，设置a=Value(2.0)、b=Value(3.0)、c=Value(4.0)，计算f=(a+b)*c，再执行f.backward()。打印f.data、a.grad、b.grad、c.grad，预期依次是20、4、4、5。", "mechanism": "第二次独立练习：重新创建节点，把c改为6。先在纸上写预测，再运行；预期f=30，a和b的梯度均为6，c的梯度仍为5。若不符，检查是否创建了新节点、是否调用backward、是否误读了data和grad。安装步骤：git clone https://github.com/samitmohan/ML.git，然后cd ML，再uv sync --group dev（需要先安装uv及Python3.10+）。网页不运行Python；小测通过不代表这项实践完成。测试通过也不保证全部算法或泛化效果。", "question": "验证新模型泛化应主要观察？", "options": ["只看训练集表现", "从未参与训练的留出数据表现", "文件行数"], "answer": 1, "feedback": "留出数据用于检查是否能应对没见过的样本，同时避免泄漏及反复调参污染。", "source": "tests/test_autograd.py", "demo": "", "id": 15, "code": {"start": 52, "end": 62, "lines": [{"text": "def test_chain_rule():", "line": 52}, {"text": "    # f = (a + b) * c", "line": 53}, {"text": "    # 中文讲解：创建可记录梯度的输入a。", "line": null}, {"text": "    a = Value(2.0)", "line": 54}, {"text": "    # 中文讲解：创建第二个输入b。", "line": null}, {"text": "    b = Value(3.0)", "line": 55}, {"text": "    # 中文讲解：创建乘法因子c。", "line": null}, {"text": "    c = Value(4.0)", "line": 56}, {"text": "    # 中文讲解：先相加再相乘，自动连接计算图。", "line": null}, {"text": "    d = (a + b) * c  # d = 20", "line": 57}, {"text": "    # 中文讲解：从结果反向传播，计算各输入的梯度。", "line": null}, {"text": "    d.backward()", "line": 58}, {"text": "    # 中文讲解：检查前向输出是否符合手算。", "line": null}, {"text": "    assert d.data == 20.0", "line": 59}, {"text": "    # 中文讲解：检查a的梯度，也就是乘法因子c。", "line": null}, {"text": "    assert a.grad == 4.0  # dd/da = c = 4", "line": 60}, {"text": "    # 中文讲解：检查b的梯度，它与a走同样的路径。", "line": null}, {"text": "    assert b.grad == 4.0  # dd/db = c = 4", "line": 61}, {"text": "    # 中文讲解：检查c的梯度，应该等于a+b。", "line": null}, {"text": "    assert c.grad == 5.0  # dd/dc = (a+b) = 5", "line": 62}], "notes": ["这是与本课练习直接对应的真实测试，替代模型形状测试作为入口。", "在仓库根目录运行uv run pytest tests/test_autograd.py。", "先不看断言，手算答案再核对；这才能发现是数学还是代码理解出错。"], "symbol": "test_chain_rule"}}], "files": ["algorithms/attention/cross_attention.py", "algorithms/attention/ try{const s=JSON.parse(localStorage.getItem(key));if(s){if(Number.isInteger(s.active)&&lessons[s.active])state.active=s.active;for(const k of ['passed','review'])if(Array.isArray(s[k]))state[k]=s[k].filter(x=>Number.isInteger(x)&&lessons[x]);if(s.notes&&typeof s.notes==='object'&&!Array.isArray(s.notes))state.notes=s.notes}}catch{$('#storage').textContent='旧记录无法读取，已恢复学习界面。'}

function catalog(){let group='';const term=$('#search').value.toLowerCase();$('#catalog').innerHTML=lessons.filter(l=>(!$('#review').checked||state.review.includes(l.id))&&(l.title+l.source+l.mechanism).toLowerCase().includes(term)).map(l=>{let h=group!==l.group?`<h3>${l.group}</h3>`:'';group=l.group;return h+`<button data-id="${l.id}" ${l.id===state.active?'aria-current="page"':''}>${String(l.id+1).padStart(2,'0')} · ${l.title} ${state.review.includes(l.id)?'↻':state.passed.includes(l.id)?'✓':''}</button>`}).join('')||'<p>没有匹配课程。</p>';$('#progressText').textContent=`${state.passed.length} / 16 小测通过`;$('#progress').value=state.passed.length;$('#files').innerHTML=files.filter(f=>f.toLowerCase().includes(term)).map(f=>`<a target="_blank" rel="noopener" href="https://github.com/samitmohan/ML/blob/${sha}/${f}">${esc(f)}</a>`).join('');}
function open(id,scroll=true){clearInterval(timer);animationCleanup();animationCleanup=()=>{};state.active=id;save();const l=lessons[id];$('#lesson').innerHTML=`<div class="eyebrow">${l.group} / 第 ${id+1} 课 · 约5–8分钟</div><h1>${l.title}</h1><p class="lead">${l.goal}</p><div class="panel"><h2>先看一个具体例子</h2><p>${l.example}</p></div><h2>把例子变成原理</h2>${paragraphs(l.mechanism)}${l.demo?'<div class="demo" id="demo"></div>':''}<div class="panel"><h2>停一下，自己判断</h2><p>${l.question}</p><div id="answers">${l.options.map((o,i)=>`<button data-answer="${i}">${esc(o)}</button>`).join('')}</div><div id="feedback" role="status">选择后会解释原因，可以重新尝试。</div></div><section class="source-section"><h2>读代码 · ${esc(l.code.symbol)}</h2><p class="muted">真实源码节选，绿色注释是新增中文讲解。行号对应原仓库；片段依赖原文件上下文，不能保证单独运行。</p><ul>${l.code.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><div class="row"><button id="codeWrap" aria-pressed="true">自动换行：开</button><button id="copyCode">复制含注释代码</button></div><div class="code-view" aria-label="中文注释源码">${l.code.lines.map(x=>`<div class="code-row ${x.line===null?'annotation':''}"><span class="line-number" aria-hidden="true">${x.line??'讲'}</span><code>${esc(x.text)||' '}</code></div>`).join('')}</div><p id="copyStatus" role="status"></p></section><details><summary>完整文件与原始源码</summary><p><a target="_blank" rel="noopener" href="https://github.com/samitmohan/ML/blob/${sha}/${l.source}">${l.source}</a></p><p>带着本课问题阅读：定位输入、计算、输出，然后改变一个输入并预测结果。此处是源码阅读入口，不是在线Python运行器。</p><small>固定源码版本 ${sha.slice(0,7)} · 讲解与浏览器实验为新增教学内容</small></details><label for="note">用自己的话写一句：这一课我理解了什么？</label><textarea id="note" placeholder="例如：训练调整的是单价，不是实际价格。"></textarea>`;$('#codeWrap').onclick=()=>{const off=$('.code-view').classList.toggle('no-wrap');$('#codeWrap').textContent='自动换行：'+(off?'关':'开');$('#codeWrap').setAttribute('aria-pressed',String(!off))};$('#copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(l.code.lines.map(x=>x.text).join('\n'));$('#copyStatus').textContent='已复制含注释的节选，需原文件上下文。'}catch{$('#copyStatus').textContent='当前浏览器不允许自动复制，请长按选择代码。'}};$('#note').value=typeof state.notes[id]==='string'?state.notes[id]:'';$('#note').oninput=()=>{state.notes[id]=$('#note').value;save()};$('#answers').onclick=e=>{const b=e.target.closest('[data-answer]');if(!b)return;const ok=+b.dataset.answer===l.answer;$('#feedback').dataset.ok=ok;$('#feedback').textContent=(ok?'答对了。':'再想一想。')+l.feedback;if(ok){if(!state.passed.includes(id))state.passed.push(id);state.review=state.review.filter(x=>x!==id)}else{state.passed=state.passed.filter(x=>x!==id);if(!state.review.includes(id))state.review.push(id)}save();catalog()};$('#prev').disabled=id===0;$('#next').disabled=id===15;catalog();demo(l.demo);closeCatalog(false);$('#lessonCount').textContent=`${id+1} / 16`;$('#dockCatalog').textContent=`${id+1}/16 · 目录`;if(scroll)$('#lesson').scrollIntoView({behavior:'instant'});}
function demo(type){if(!type)return;const d=$('#demo');if(type==='apple'){let w=2,step=0;d.innerHTML='<h2>看一次电脑如何学习</h2><div class="flow" id="flow"><span>① 预测</span><span>② 比较</span><span>③ 看方向</span><span>④ 更新</span></div><div class="price-track"><div><span>实际 6元</span><div class="price-target"></div></div><div><span id="predLabel">预测 4元</span><div id="predBar"></div></div></div><div class="row"><button id="animate" type="button">播放分步动画</button><button id="animNext" type="button">只看下一步</button></div><p id="animText" role="status">先看固定例子：2斤苹果实际6元，电脑猜每斤2元。</p><hr><h2>再自己调一调</h2><label for="weight">猜测单价（元/斤）</label><input id="weight" type="range" min="0" max="6" step="0.01" value="2"><div class="numbers" id="metrics"></div><div class="row"><label for="rate">学习率</label><select id="rate"><option>0.1</option><option>0.01</option><option>0.3</option></select><button id="one">按梯度更新一步</button><button id="reset">重置</button></div><p id="calculation" role="status"></p><small>固定输入2斤、真实价格6元；L=(2w−6)²。允许先拖动再更新，不自动快进。</small>';function draw(msg){$('#weight').value=w;$('#predLabel').textContent=`预测 ${(2*w).toFixed(2)}元`;$('#predBar').style.width=`${w/6*100}%`;$('#metrics').innerHTML=`<div><span>单价</span><strong>${w.toFixed(3)}</strong></div><div><span>预测总价 / 元</span><strong>${(2*w).toFixed(3)}</strong></div><div><span>平方损失</span><strong>${((2*w-6)**2).toFixed(4)}</strong></div>`;$('#calculation').textContent=msg||`第${step}步：梯度 = 4 × (2 × ${w.toFixed(3)} − 6) = ${(4*(2*w-6)).toFixed(3)}`;}$('#weight').oninput=e=>{w=+e.target.value;step=0;draw()};$('#one').onclick=()=>{const old=w,g=4*(2*w-6),rate=+$('#rate').value,newW=w-rate*g;if(Math.abs(newW)>6||newW<0){$('#calculation').textContent='这一步会使单价超出0～6元演示范围，已停止。请减小学习率或重置；真实训练不会自动受这个范围保护。';return}w=newW;step++;draw(`${old.toFixed(3)} − ${rate} × (${g.toFixed(3)}) = ${w.toFixed(3)} 元/斤`)};let phase=-1,playing=false;function pause(){clearInterval(timer);playing=false;$('#animate').textContent=phase===3?'重播动画':'播放分步动画'}function advance(){if(phase===3||phase===-1){w=2;step=0;phase=0}else phase++;draw();const captions=['先预测：2斤 × 2元/斤 = 4元。绿色条比实际6元短。','比较答案：预测4元，实际6元，少算2元；平方损失为4。','判断方向：梯度是−8；减去负数会提高单价。这里用学习率0.1。','更新后：单价2.8元，预测5.6元，损失降到0.16。这是一次更新，还没有完全学好。'];if(phase===3){w=2.8;step=1;draw();pause()}$('#animText').textContent=captions[phase];[...$('#flow').children].forEach((el,i)=>el.classList.toggle('active',i===phase))}$('#animate').onclick=()=>{if(playing){pause();return}playing=true;$('#animate').textContent='暂停动画';advance();if(phase!==3)timer=setInterval(advance,2600)};$('#animNext').onclick=()=>{pause();advance()};const manualInput=$('#weight').oninput,manualUpdate=$('#one').onclick;function endDemo(){pause();phase=-1;[...$('#flow').children].forEach(el=>el.classList.remove('active'));$('#animText').textContent='手动实验：观察预测条和损失，点击更新只改变一次单价。'}$('#weight').oninput=e=>{endDemo();manualInput(e)};$('#one').onclick=()=>{endDemo();manualUpdate()};$('#reset').onclick=()=>{endDemo();w=2;step=0;draw()};animationCleanup=pause;draw();}
if(type==='matrix'){let k=0;const a=[[2,1],[1,3]],b=[[3,2],[4,1]],y=[[10,5],[15,5]];d.innerHTML='<h2>一行 × 一列</h2><div id="matrices" class="equation"></div><p id="matExplain" role="status"></p><div class="row"><button id="cellNext">看下一个输出格</button><button id="matrixPlay">播放逐格动画</button></div>';function draw(){const r=Math.floor(k/2),c=k%2;$('#matrices').innerHTML=[a,b,y].map((m,idx)=>`${idx?'<b>'+(idx===1?'×':'=')+'</b>':''}<div><small>${['订单特征 X','两组权重 W','输出 Y'][idx]}</small><div class="matrix">${m.flatMap((row,i)=>row.map((v,j)=>`<span class="cell ${(idx===0?i===r:idx===1?j===c:i===r&&j===c)?'hot':''}">${v}</span>`)).join('')}</div></div>`).join('');$('#matExplain').textContent=`第${r+1}行 × 第${c+1}列：${a[r][0]}×${b[0][c]} + ${a[r][1]}×${b[1][c]} = ${y[r][c]}`;}let running=false,count=0;function stop(){clearInterval(timer);running=false;$('#matrixPlay').textContent='播放逐格动画'}$('#cellNext').onclick=()=>{stop();k=(k+1)%4;draw()};$('#matrixPlay').onclick=()=>{if(running){stop();return}running=true;count=0;k=0;draw();$('#matrixPlay').textContent='暂停';timer=setInterval(()=>{k=(k+1)%4;count++;draw();if(count===3)stop()},2400)};animationCleanup=stop;draw();}
if(type==='attention'){let pos=1;d.innerHTML='<h2>当前字符能看见哪些位置？</h2><div class="row" id="tokens"></div><div class="att" id="att"></div><p id="attText" role="status"></p><small>教学分数固定为[1,2,3,4]，并非训练所得的语言注意力；只演示遮罩与softmax。</small>';function draw(){const denom=[1,2,3,4].slice(0,pos+1).reduce((s,x)=>s+Math.exp(x),0);$('#tokens').innerHTML=['BOS','a','n','a'].map((t,i)=>`<button data-pos="${i}" aria-pressed="${i===pos}">${i}: ${t}</button>`).join('');$('#att').innerHTML=[1,2,3,4].map((x,i)=>`<span class="${i>pos?'masked':''}">${i>pos?'屏蔽':(Math.exp(x)/denom*100).toFixed(1)+'%'}</span>`).join('');$('#attText').textContent=`位置${pos}只能访问0～${pos}；可见位置权重之和为100%（显示有舍入）。`;}$('#tokens').onclick=e=>{const b=e.target.closest('[data-pos]');if(b){pos=+b.dataset.pos;draw()}};draw();}}
$('#catalog').onclick=e=>{const b=e.target.closest('[data-id]');if(b)open(+b.dataset.id)};$('#search').oninput=catalog;$('#review').onchange=catalog;$('#prev').onclick=()=>open(state.active-1);$('#next').onclick=()=>open(state.active+1);let opener=null;function closeCatalog(restore=true){$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open');document.body.classList.remove('catalog-open');['#mobile','#dockCatalog'].forEach(x=>$(x).setAttribute('aria-expanded','false'));if(restore&&opener)opener.focus()}function toggleCatalog(e){if($('#sidebar').classList.contains('open')){closeCatalog();return}opener=e.currentTarget;$('#sidebar').classList.add('open');$('#backdrop').classList.add('open');document.body.classList.add('catalog-open');['#mobile','#dockCatalog'].forEach(x=>$(x).setAttribute('aria-expanded','true'));$('#closeCatalog').focus()}$('#mobile').onclick=toggleCatalog;$('#dockCatalog').onclick=toggleCatalog;$('#closeCatalog').onclick=()=>closeCatalog();$('#backdrop').onclick=()=>closeCatalog();document.addEventListener('keydown',e=>{if(!document.body.classList.contains('catalog-open'))return;if(e.key==='Escape')closeCatalog();if(e.key==='Tab'){const nodes=[...$('#sidebar').querySelectorAll('button,input,summary,a')].filter(n=>n.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});try{document.body.classList.toggle('large-text',localStorage.getItem('ml-large-text')==='true')}catch{}$('#fontSize').setAttribute('aria-pressed',String(document.body.classList.contains('large-text')));$('#fontSize').onclick=()=>{const large=document.body.classList.toggle('large-text');$('#fontSize').setAttribute('aria-pressed',String(large));try{localStorage.setItem('ml-large-text',String(large))}catch{}};$('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({course:'从苹果到GPT',source:sha,...state},null,2)],{type:'application/json'}));a.href=url;a.download='ml-learning-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};open(state.active,false);
})();
</script></html>
